name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # No inputs: this repo already enforced a 100% per-line gate at
  # `--workspace --all-features`, which is exactly the shared workflow's default,
  # and MSRV is read from rust-version. Anything that needed configuring would be
  # a behaviour change smuggled in by an adoption PR, so there is nothing here.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@c066556944bcbdd7d1812cd7fe4896b945dfd85c
    with:
      # CARRIED ACROSS. The replaced workflow excluded the CLI shell from the
      # coverage gate; without this, adoption newly demands 100% line coverage
      # of a binary this repo has never gated. Verified load-bearing — the
      # pattern matches a real file here.
      coverage-ignore-regex: '(^|/)src/(main\.rs|bin/)'
